<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Mi PWA</title>

  <!-- Vinculación del Manifest para PWA -->
  <link rel="manifest" href="./manifest.json">

  <!-- Configuración de color para la barra de estado -->
  <meta name="theme-color" content="#2196f3">

  <!-- Configuración para Android / iOS PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f0f2f5;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-container {
      background: #ffffff;
      padding: 30px 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 400px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h2 {
      color: #1a1a1a;
      font-size: 24px;
      margin-bottom: 8px;
    }

    .header p {
      color: #666;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      color: #333;
      font-size: 14px;
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .form-group input:focus {
      border-color: #2196f3;
      box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.2);
    }

    .btn-submit {
      width: 100%;
      background-color: #2196f3;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .btn-submit:hover {
      background-color: #1976d2;
    }

    .btn-submit:disabled {
      background-color: #90caf9;
      cursor: not-allowed;
    }

    /* Botón de instalación PWA */
    .btn-install {
      width: 100%;
      background-color: #e3f2fd;
      color: #1976d2;
      border: 1px solid #bbdefb;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
    }

    .alert-msg {
      margin-top: 14px;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      text-align: center;
      display: none;
      word-break: break-word;
    }

    .alert-error {
      background-color: #ffebee;
      color: #c62828;
      border: 1px solid #ffcdd2;
    }

    .alert-success {
      background-color: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #c8e6c9;
    }
  </style>
</head>
<body>

  <main class="login-container">
    <header class="header">
      <h2>Iniciar Sesión</h2>
      <p>Ingresa tus credenciales para acceder</p>
    </header>

    <form id="login-form">
      <div class="form-group">
        <label for="username">Usuario o Correo</label>
        <input type="text" id="username" autocomplete="username" placeholder="Ingresa tu usuario" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-submit" id="btn-ingresar">Ingresar</button>
    </form>

    <div id="alert" class="alert-msg"></div>

    <!-- Botón condicional para instalar la PWA -->
    <button id="btn-install" class="btn-install" hidden>📱 Instalar aplicación</button>
  </main>

  <script>
    // ==========================================
    // URL DEL SCRIPT DE GOOGLE APPS SCRIPT
    // ==========================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbytHjsAF6wlmcbEzRIDO6D6i7RSe--B7VU5_w9wuPIQ9uZiNAtCkw_dkulzigpbo1-GEQ/exec";

    // 1. Registro del Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => {
            console.log('SW registrado en:', reg.scope);
            reg.update();
          })
          .catch((err) => console.error('Error al registrar SW:', err));
      });
    }

    // 2. Control de instalación PWA
    let deferredPrompt;
    const installBtn = document.getElementById('btn-install');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.hidden = false;
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.hidden = true;
    });

    // 3. Manejo del formulario de Login
    const loginForm = document.getElementById('login-form');
    const alertBox = document.getElementById('alert');
    const btnIngresar = document.getElementById('btn-ingresar');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();

      // Estado de carga en interfaz
      btnIngresar.disabled = true;
      btnIngresar.textContent = "Verificando...";
      alertBox.style.display = 'none';

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify({
            action: 'login',
            username: user,
            password: pass
          })
        });

        const rawText = await response.text();
        console.log("Respuesta sin procesar del servidor:", rawText);

        const result = JSON.parse(rawText);
        console.log("Respuesta parseada:", result);

        if (result.success) {
          showAlert("¡Inicio de sesión exitoso! Redirigiendo...", "success");
          setTimeout(() => {
            window.location.href = 'autorizar.html'; 
          }, 1200);
        } else {
          showAlert(result.message || "Credenciales incorrectas.", "error");
          btnIngresar.disabled = false;
          btnIngresar.textContent = "Ingresar";
        }

      } catch (error) {
        console.error("Error en la petición:", error);
        showAlert(error.message || "Error de conexión con el servidor.", "error");
        btnIngresar.disabled = false;
        btnIngresar.textContent = "Ingresar";
      }
    });

    function showAlert(message, type) {
      alertBox.textContent = message;
      alertBox.className = `alert-msg alert-${type}`;
      alertBox.style.display = 'block';
    }
  </script>
</body>
</html>
